name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install HTTP client used by maintenance regressions
        run: python -m pip install aiohttp
      - name: Run offline integration regressions
        run: python -m unittest discover -s tests -v
